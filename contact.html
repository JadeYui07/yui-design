<script>
'use strict';
// ── Fluid canvas animation ──────────────────────────────────
const canvas = document.getElementById('fluid');
const ctx = canvas.getContext('2d');
const EDGE_PAD = 220;
const BG = '#F5F8FA';

let W = 0, H = 0;
function resize() {
  W = window.innerWidth  + EDGE_PAD * 2;
  H = window.innerHeight + EDGE_PAD * 2;
  canvas.width  = W; canvas.height = H;
  canvas.style.left   = `-${EDGE_PAD}px`;
  canvas.style.top    = `-${EDGE_PAD}px`;
  canvas.style.width  = `${W}px`;
  canvas.style.height = `${H}px`;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

const params = { mice:2, speed:1.4, omega:0.12, drift:0.87, brush:185, blur:36, fade:0.009, hue:1.4, satShift:6, lightShift:10 };

const PALETTE_HEX = ['#F5E5A0','#F5D2C0','#F5C8D8','#F0BCDC','#DCB8E8','#C5B0EE','#B8C5EF','#B5DAF0'];
function hexToHSL(hex) {
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h=0,s=0;
  const l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=((g-b)/d+(g<b?6:0));break;case g:h=((b-r)/d+2);break;case b:h=((r-g)/d+4);break;}h/=6;}
  return{h:h*360,s:s*100,l:l*100};
}
const PALETTE = PALETTE_HEX.map(hexToHSL);

function paletteColor(idx, alpha) {
  const mi = PALETTE.length-1, ci = Math.max(0,Math.min(mi,idx));
  const lo=Math.floor(ci), hi=Math.min(lo+1,mi), f=ci-lo, a=PALETTE[lo], b=PALETTE[hi];
  let dh=b.h-a.h; if(dh>180)dh-=360; else if(dh<-180)dh+=360;
  const h=(a.h+dh*f+360)%360;
  const s=Math.max(0,Math.min(95,a.s+(b.s-a.s)*f+params.satShift));
  const l=Math.max(20,Math.min(95,a.l+(b.l-a.l)*f+params.lightShift));
  return `hsla(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${alpha})`;
}
function paletteFromPosition(x,y){
  const nx=Math.max(0,Math.min(1,(x-EDGE_PAD)/(W-EDGE_PAD*2)));
  const ny=Math.max(0,Math.min(1,(y-EDGE_PAD)/(H-EDGE_PAD*2)));
  return(nx*0.6+ny*0.4)*(PALETTE.length-1);
}

class VirtualMouse {
  constructor(){
    this.x=W*(0.35+Math.random()*0.3); this.y=H*(0.35+Math.random()*0.3);
    this.theta=Math.random()*Math.PI*2; this.speed=params.speed; this.speedTarget=params.speed;
    this.paletteIdx=Math.random()*(PALETTE.length-1); this.paletteDir=Math.random()<0.5?-1:1;
  }
  update(){
    this.theta+=(Math.random()-0.5)*2*params.omega;
    if(Math.random()<0.015*params.drift){this.speedTarget=params.speed*(0.4+Math.random()*1.4);}
    this.speed+=(this.speedTarget-this.speed)*0.025;
    this.x+=Math.cos(this.theta)*this.speed; this.y+=Math.sin(this.theta)*this.speed;
    const cx=W/2,cy=H/2,dx=this.x-cx,dy=this.y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    const maxR=Math.min(W-EDGE_PAD*2,H-EDGE_PAD*2)*0.45;
    if(dist>maxR){const ah=Math.atan2(-dy,-dx);let df=ah-this.theta;
      while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
      this.theta+=df*Math.min(0.18,((dist-maxR)/maxR)*0.2);}
    const mi=PALETTE.length-1;
    this.paletteIdx+=params.hue*0.03*this.paletteDir;
    if(this.paletteIdx>mi){this.paletteIdx=mi-(this.paletteIdx-mi);this.paletteDir=-1;}
    else if(this.paletteIdx<0){this.paletteIdx=-this.paletteIdx;this.paletteDir=1;}
  }
  draw(ctx){
    const r=params.brush;
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r);
    g.addColorStop(0,paletteColor(this.paletteIdx,0.55));
    g.addColorStop(0.5,paletteColor(this.paletteIdx,0.18));
    g.addColorStop(1,paletteColor(this.paletteIdx,0));
    ctx.fillStyle=g; ctx.fillRect(this.x-r,this.y-r,r*2,r*2);
  }
}

let mice=[];
function rebuildMice(){const old=mice;mice=[];for(let i=0;i<params.mice;i++)mice.push(old[i]||new VirtualMouse());}
rebuildMice();

const rm={active:false,inWarmup:false,targetX:0,targetY:0,drawX:0,drawY:0,prevDrawX:0,prevDrawY:0,
  paletteIdx:Math.random()*(PALETTE.length-1),paletteDir:Math.random()<0.5?-1:1,lastMoveTime:0};

window.addEventListener('mousemove',function(e){
  rm.targetX=e.clientX+EDGE_PAD; rm.targetY=e.clientY+EDGE_PAD;
  if(!rm.active){rm.drawX=rm.targetX;rm.drawY=rm.targetY;rm.prevDrawX=rm.drawX;rm.prevDrawY=rm.drawY;
    rm.active=true;rm.inWarmup=true;setTimeout(()=>{rm.inWarmup=false;},250);}
  rm.lastMoveTime=performance.now();
});
window.addEventListener('mouseleave',()=>{rm.active=false;});
window.addEventListener('mouseout',function(e){if(!e.relatedTarget&&!e.toElement)rm.active=false;});

function drawRealMouse(){
  const idle=performance.now()-rm.lastMoveTime>1500;
  rm.prevDrawX=rm.drawX; rm.prevDrawY=rm.drawY;
  rm.drawX+=(rm.targetX-rm.drawX)*0.35; rm.drawY+=(rm.targetY-rm.drawY)*0.35;
  const dx=rm.drawX-rm.prevDrawX,dy=rm.drawY-rm.prevDrawY,v=Math.sqrt(dx*dx+dy*dy);
  const velFactor=Math.max(0.3,1-Math.min(1,v/30)*0.65);
  const baseAlpha=idle?0.15:(rm.inWarmup?0.35:0.85)*velFactor;
  const mi=PALETTE.length-1;
  rm.paletteIdx+=params.hue*0.04*rm.paletteDir;
  if(rm.paletteIdx>mi){rm.paletteIdx=mi-(rm.paletteIdx-mi);rm.paletteDir=-1;}
  else if(rm.paletteIdx<0){rm.paletteIdx=-rm.paletteIdx;rm.paletteDir=1;}
  const idx=paletteFromPosition(rm.drawX,rm.drawY)*0.6+rm.paletteIdx*0.4;
  const r=params.brush*1.15;
  const g=ctx.createRadialGradient(rm.drawX,rm.drawY,0,rm.drawX,rm.drawY,r);
  g.addColorStop(0,paletteColor(idx,0.55*baseAlpha));
  g.addColorStop(0.5,paletteColor(idx,0.18*baseAlpha));
  g.addColorStop(1,paletteColor(idx,0));
  ctx.fillStyle=g; ctx.fillRect(rm.drawX-r,rm.drawY-r,r*2,r*2);
}

const BG_R=245, BG_G=248, BG_B=250;
let densityBoost = 1;
const _sc = Object.assign(document.createElement('canvas'), {width:6, height:6});
const _sctx = _sc.getContext('2d', {willReadFrequently:true});
let _lastSample = 0;

function updateDensityBoost() {
  const now = performance.now();
  if (now - _lastSample < 2000) return;
  _lastSample = now;
  _sctx.drawImage(canvas, EDGE_PAD, EDGE_PAD, W-EDGE_PAD*2, H-EDGE_PAD*2, 0, 0, 6, 6);
  const px = _sctx.getImageData(0, 0, 6, 6).data;
  let dev = 0;
  for (let i=0; i<px.length; i+=4) {
    dev += (Math.abs(px[i]-BG_R) + Math.abs(px[i+1]-BG_G) + Math.abs(px[i+2]-BG_B)) / (3*255);
  }
  dev /= 36;
  const target = 1 + Math.min(3, Math.max(0, dev - 0.05) / 0.15 * 3);
  densityBoost += (target - densityBoost) * 0.25;
}

let _hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { _hiddenAt = performance.now(); }
  else if (performance.now() - _hiddenAt > 30000) { densityBoost = 4; }
});

function fluidFrame(){
  updateDensityBoost();
  let ef = params.fade;
  if(params.blur<50){const boost=1+((50-params.blur)/50)*3; ef=Math.min(0.25,params.fade*boost);}
  ef = Math.min(0.25, ef * densityBoost);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(245,248,250,${ef})`; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=rm.active?0.55:1.0;
  for(const m of mice){m.update();m.draw(ctx);}
  ctx.globalAlpha=1.0;
  if(rm.active)drawRealMouse();
  requestAnimationFrame(fluidFrame);
}
canvas.style.filter=`blur(${params.blur}px)`;
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
} else {
  requestAnimationFrame(fluidFrame);
}
// ── End fluid canvas ────────────────────────────────────────
</script>

</script>

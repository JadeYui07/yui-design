<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzhuo Zhang</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <style>
    /* ── Same pastel gradient as about page ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 8% 12%,  rgba(220,184,232,0.30) 0%, transparent 70%),
        radial-gradient(ellipse 55% 65% at 92% 78%,  rgba(181,218,240,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 45% at 72% 18%,  rgba(197,176,238,0.20) 0%, transparent 65%),
        radial-gradient(ellipse 45% 55% at 22% 88%,  rgba(245,210,192,0.22) 0%, transparent 65%);
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      position: relative;
    }

    /* ── Gate wrapper ── */
    .gate {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-8);
      width: 100%;
      max-width: 380px;
    }

    /* ── Logo + heading ── */
    .gate-header {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .gate-logo-wrap { line-height: 0; }
    .gate-logo-wrap img { opacity: 0.88; display: block; height: 56px; max-height: 56px; width: auto; max-width: 240px; object-fit: contain; }

    .gate-heading {
      font-family: var(--font-display);
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 700;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    /* ── Form ── */
    .gate-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      width: 100%;
    }

    .gate-input {
      width: 100%;
      padding: 14px var(--space-3);
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s var(--transition), box-shadow 0.2s var(--transition);
      -webkit-appearance: none;
    }

    .gate-input::placeholder { color: var(--text-tertiary); }

    .gate-input:focus {
      border-color: var(--rust-300);
      box-shadow: 0 0 0 3px var(--rust-50);
    }

    .gate-input.shake {
      animation: gate-shake 0.38s var(--transition);
    }

    @keyframes gate-shake {
      0%, 100% { transform: translateX(0); }
      18%       { transform: translateX(-7px); }
      36%       { transform: translateX(7px); }
      54%       { transform: translateX(-4px); }
      72%       { transform: translateX(4px); }
    }

    .gate-btn {
      width: 100%;
      padding: 14px var(--space-3);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-inverse);
      background: var(--rust);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s var(--transition);
    }

    .gate-btn:hover:not(:disabled) { background: var(--rust-700); }
    .gate-btn:active:not(:disabled) { background: var(--rust-900); }
    .gate-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .gate-error {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.18s var(--transition);
      line-height: 1.6;
    }
    .gate-error.visible { opacity: 1; }
    .gate-error a { color: var(--rust); text-underline-offset: 3px; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="gate">
  <div class="gate-header">
    <div class="gate-logo-wrap">
      <img src="/images/name_no_bg.webp" alt="Yuzhuo Zhang" height="28">
    </div>
    <h1 class="gate-heading">Hey, welcome.<br>Good to see you.</h1>
  </div>

  <form class="gate-form" id="gate-form" novalidate>
    <label for="gate-input" class="sr-only">Password</label>
    <input
      class="gate-input"
      id="gate-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      autofocus
      required
    >
    <button class="gate-btn" type="submit" id="gate-btn">Enter</button>
    <p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p>
  </form>
</div>

<script>
  const form  = document.getElementById('gate-form');
  const input = document.getElementById('gate-input');
  const btn   = document.getElementById('gate-btn');
  const error = document.getElementById('gate-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;

    btn.disabled = true;
    error.classList.remove('visible');

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        window.location.href = '/';
      } else {
        error.innerHTML = 'Not quite. <a href="mailto:jadeyuizhang@gmail.com">Reach out</a> if you need access.';
        error.classList.add('visible');
        input.classList.add('shake');
        input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
        input.select();
      }
    } catch {
      error.textContent = 'Something went wrong. Try again.';
      error.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  });
</script>

<!-- Vercel Web Analytics -->
<script type="module" src="analytics.js"></script>

</body>
</html>

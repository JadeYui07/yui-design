<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzhuo Zhang</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <style>
    /* ── Same pastel gradient as about page ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 8% 12%,  rgba(220,184,232,0.30) 0%, transparent 70%),
        radial-gradient(ellipse 55% 65% at 92% 78%,  rgba(181,218,240,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 45% at 72% 18%,  rgba(197,176,238,0.20) 0%, transparent 65%),
        radial-gradient(ellipse 45% 55% at 22% 88%,  rgba(245,210,192,0.22) 0%, transparent 65%);
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      position: relative;
    }

    /* ── Gate wrapper ── */
    .gate {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-6);
      width: 100%;
      max-width: 380px;
    }

    /* ── Logo + heading ── */
    .gate-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
    }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .gate-logo-wrap { line-height: 0; }
    .gate-logo-wrap img { opacity: 0.88; display: block; height: 56px; max-height: 56px; width: auto; max-width: 240px; object-fit: contain; }

    .gate-heading {
      font-family: var(--font-body);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.035em;
      color: var(--text);
    }

    .gate-sub {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 34ch;
      margin-inline: auto;
    }

    /* ── Form ── */
    .gate-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      width: 100%;
    }

    .gate-input {
      width: 100%;
      padding: 14px var(--space-3);
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      outline: none;
      transition: border-color 0.2s var(--transition), box-shadow 0.2s var(--transition);
      -webkit-appearance: none;
    }

    .gate-input::placeholder { color: var(--text-tertiary); }

    .gate-input:focus {
      border-color: var(--rust-300);
      box-shadow: 0 0 0 3px var(--rust-50);
    }

    .gate-input.shake {
      animation: gate-shake 0.38s var(--transition);
    }

    @keyframes gate-shake {
      0%, 100% { transform: translateX(0); }
      18%       { transform: translateX(-7px); }
      36%       { transform: translateX(7px); }
      54%       { transform: translateX(-4px); }
      72%       { transform: translateX(4px); }
    }

    .gate-btn {
      width: 100%;
      padding: 14px var(--space-3);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-inverse);
      background: var(--rust);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s var(--transition), transform 0.2s var(--transition), box-shadow 0.2s var(--transition);
    }

    .gate-btn:hover:not(:disabled) { background: var(--rust-700); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .gate-btn:active:not(:disabled) { background: var(--rust-900); transform: translateY(0); }
    .gate-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .gate-error {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.18s var(--transition);
      line-height: 1.6;
    }
    .gate-error.visible { opacity: 1; }
    .gate-error a { color: var(--rust); text-underline-offset: 3px; }

    /* ── No-password route ── */
    .gate-alt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
    }
    .gate-alt-note { font-size: 13px; color: var(--text-tertiary); }
    .gate-alt-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.2s var(--transition), background 0.2s var(--transition), color 0.2s var(--transition);
    }
    .gate-alt-link:hover { border-color: var(--rust-300); background: var(--rust-50); color: var(--rust-700); }

    /* ── Focus — same treatment as every other page ── */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--rust);
      outline-offset: 3px;
      border-radius: var(--radius-full);
    }

    @media (prefers-reduced-motion: reduce) {
      .gate-btn:hover:not(:disabled) { transform: none; }
      .gate-input.shake { animation: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="gate">
  <div class="gate-header">
    <div class="gate-logo-wrap">
      <img src="/images/name_no_bg.webp" alt="Yuzhuo Zhang" height="28">
    </div>
    <h1 class="gate-heading">Hey, welcome.<br>Good to see you.</h1>
    <p class="gate-sub">This portfolio is password-protected. Enter the password to take a look around.</p>
  </div>

  <form class="gate-form" id="gate-form" novalidate>
    <label for="gate-input" class="sr-only">Password</label>
    <input
      class="gate-input"
      id="gate-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      autofocus
      required
    >
    <button class="gate-btn" type="submit" id="gate-btn">Enter</button>
    <p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p>
  </form>

  <div class="gate-alt">
    <p class="gate-alt-note">Don't have the password?</p>
    <a class="gate-alt-link" href="https://www.linkedin.com/in/yuzhuo-zhang777/" target="_blank" rel="noopener noreferrer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      Reach out on LinkedIn
    </a>
  </div>
</div>

<script>
  const form  = document.getElementById('gate-form');
  const input = document.getElementById('gate-input');
  const btn   = document.getElementById('gate-btn');
  const error = document.getElementById('gate-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;

    btn.disabled = true;
    error.classList.remove('visible');

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        window.location.href = '/';
      } else {
        error.innerHTML = 'Not quite. <a href="https://www.linkedin.com/in/yuzhuo-zhang777/" target="_blank" rel="noopener noreferrer">Reach out on LinkedIn</a> if you need access.';
        error.classList.add('visible');
        input.classList.add('shake');
        input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
        input.select();
      }
    } catch {
      error.textContent = 'Something went wrong. Try again.';
      error.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
